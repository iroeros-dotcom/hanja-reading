<script>/* Offline quiz and progress helpers. No dependencies or network access. */
const HanjaEngine = (() => {
  'use strict';

  const MODES = new Set(['mixed', 'reading', 'reverse']);
  const MAX_HISTORY = 200;
  const validId = id => Number.isInteger(id) && id >= 1 && id <= 300;
  const integer = (value, fallback, min, max) => {
    if (typeof value !== 'number' || !Number.isFinite(value)) return fallback;
    return Math.max(min, Math.min(max, Math.floor(value)));
  };
  const label = item => `${item.meaning} ${item.sound}`;

  function shuffle(array, rng = Math.random) {
    const copy = [...array];
    for (let i = copy.length - 1; i > 0; i--) {
      const random = Number(rng());
      const safe = Number.isFinite(random) ? Math.max(0, Math.min(0.9999999999999999, random)) : 0;
      const j = Math.floor(safe * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function uniqueItems(items) {
    const seen = new Set();
    return (Array.isArray(items) ? items : []).filter(item => {
      if (!item || !validId(item.id) || seen.has(item.id) ||
          typeof item.hanja !== 'string' || !item.hanja ||
          typeof item.meaning !== 'string' || !item.meaning ||
          typeof item.sound !== 'string' || !item.sound) return false;
      seen.add(item.id);
      return true;
    });
  }

  function buildQuiz(items, options = {}, allItems = items) {
    const candidates = uniqueItems(items);
    const mode = MODES.has(options.mode) ? options.mode : 'mixed';
    const count = integer(options.count, 30, 1, 300);
    const selected = shuffle(candidates).slice(0, count);
    const universe = uniqueItems([...candidates, ...(Array.isArray(allItems) ? allItems : [])]);

    return selected.map((item, index) => {
      // Alternation keeps a mixed quiz balanced even when only a few questions are selected.
      const kind = mode === 'mixed' ? (index % 2 === 0 ? 'reading' : 'reverse') : mode;
      const answer = kind === 'reading' ? label(item) : item.hanja;
      const distractors = [];
      const seen = new Set([answer]);
      const append = candidate => {
        // A matching reading would also be a valid answer to a reverse question.
        if (kind === 'reverse' && label(candidate) === label(item)) return;
        const value = kind === 'reading' ? label(candidate) : candidate.hanja;
        if (!seen.has(value)) {
          seen.add(value);
          distractors.push(value);
        }
      };
      shuffle(candidates).forEach(append);
      if (distractors.length < 3) shuffle(universe).forEach(append);
      if (distractors.length < 3) {
        throw new Error('퀴즈를 만들려면 서로 다른 보기 4개를 만들 수 있는 한자 목록이 필요해요.');
      }
      return {
        item,
        kind,
        prompt: kind === 'reading' ? item.hanja : label(item),
        answer,
        options: shuffle([answer, ...distractors.slice(0, 3)])
      };
    });
  }

  function initialState() {
    return {version: 1, known: [], wrong: [], results: [], lastGroup: 1};
  }

  function normalizeResult(raw) {
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return null;
    if (!Number.isInteger(raw.group) || raw.group < 1 || raw.group > 10) return null;
    if (typeof raw.total !== 'number' || !Number.isFinite(raw.total) || raw.total < 1) return null;
    if (typeof raw.score !== 'number' || !Number.isFinite(raw.score)) return null;
    const total = integer(raw.total, 1, 1, 300);
    const score = integer(raw.score, 0, 0, total);
    if (typeof raw.date !== 'string' || !raw.date.trim()) return null;
    const date = new Date(raw.date);
    if (!Number.isFinite(date.getTime())) return null;
    return {
      group: raw.group,
      score,
      total,
      mode: MODES.has(raw.mode) ? raw.mode : 'mixed',
      date: date.toISOString(),
      review: raw.review === true
    };
  }

  function sanitizeState(raw, allItems) {
    const state = initialState();
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return state;
    const validIds = new Set(uniqueItems(allItems).map(item => item.id));
    const cleanIds = value => Array.isArray(value)
      ? [...new Set(value.filter(id => validIds.has(id)))]
      : [];
    state.wrong = cleanIds(raw.wrong);
    const wrong = new Set(state.wrong);
    state.known = cleanIds(raw.known).filter(id => !wrong.has(id));
    state.lastGroup = integer(raw.lastGroup, 1, 1, 10);
    state.results = Array.isArray(raw.results)
      ? raw.results.map(normalizeResult).filter(Boolean).slice(-MAX_HISTORY)
      : [];
    return state;
  }

  function recordAnswer(state, itemId, correct) {
    if (!validId(itemId)) return state;
    state.known = Array.isArray(state.known) ? state.known : [];
    state.wrong = Array.isArray(state.wrong) ? state.wrong : [];
    if (correct === true) {
      state.wrong = state.wrong.filter(id => id !== itemId);
      if (!state.known.includes(itemId)) state.known.push(itemId);
    } else {
      state.known = state.known.filter(id => id !== itemId);
      if (!state.wrong.includes(itemId)) state.wrong.push(itemId);
    }
    return state;
  }

  function recordResult(state, result) {
    const normalized = normalizeResult({...result, date: result?.date ?? new Date().toISOString()});
    if (!normalized) return state;
    if (!Array.isArray(state.results)) state.results = [];
    state.results.push(normalized);
    state.results = state.results.slice(-MAX_HISTORY);
    if (!normalized.review) state.lastGroup = normalized.group;
    return state;
  }

  function summarize(state, items) {
    const source = uniqueItems(items);
    const ids = new Set(source.map(item => item.id));
    const known = [...new Set(state.known || [])].filter(id => ids.has(id)).length;
    const wrong = [...new Set(state.wrong || [])].filter(id => ids.has(id)).length;
    const results = (state.results || []).filter(result => !result.review);
    const best = {};
    results.forEach(result => {
      const rate = result.total ? result.score / result.total : 0;
      if (!best[result.group] || rate > best[result.group].rate) {
        best[result.group] = {...result, rate};
      }
    });
    return {known, wrong, total: source.length, best, attempts: (state.results || []).length};
  }

  return Object.freeze({shuffle, buildQuiz, initialState, sanitizeState, recordAnswer, recordResult, summarize});
})();
</script>

function renderHelp() { return `<div class="page-intro"><span class="eyebrow">처음이라면 여기부터</span><h1 class="page-heading">사용 안내</h1><p class="muted">웹주소를 열고, 한자의 뜻과 음을 읽어 보세요.</p></div><div class="help-grid"><section class="help-card"><h3>1. 한자를 보고 읽어요</h3><p>한자가 나오면 뜻과 음을 먼저 소리 내어 읽어 봐요. 家를 보면 ‘집 가’라고 읽는 거예요.</p><ol><li>공부방에서 원하는 묶음의 ‘읽기 연습’을 눌러요.</li><li>뜻과 음을 읽은 뒤 ‘뜻·음 확인’을 눌러 답을 확인해요.</li><li>스스로 읽을 수 있으면 ‘읽을 수 있어요’로 표시해요.</li><li>읽기 퀴즈를 풀고 틀린 한자를 다시 읽어요.</li></ol></section><section class="help-card"><h3>2. 3회씩, 30자씩 연습해요</h3><p>첨부된 30회 학습지를 3회씩 묶었어요. 한 묶음은 30자, 전체는 10묶음·300자예요. 읽기 연습에서는 회차별 10자씩 따로 볼 수도 있어요.</p><p>퀴즈에서도 한자만 먼저 나와요. 뜻과 음을 읽고 ‘읽었어요 · 보기 열기’를 누르면 네 개의 보기가 나와요. 가볍게 10문제 또는 묶음 전체 30문제를 선택해요. 음성을 녹음하거나 자동으로 채점하지 않으니, 먼저 읽고 보기로 확인해 주세요.</p></section><section class="help-card"><h3>3. 웹주소로 바로 열어요</h3><p>휴대폰·태블릿·PC에서 이 사이트 주소를 Chrome, Edge, Safari 등의 웹브라우저로 열어 주세요. 접속할 때는 인터넷 연결이 필요해요.</p><p>별도 학습 계정이나 유료 API를 사용하지 않아요. 이 사이트는 학습을 위해 마이크 권한이나 이름·이메일을 요청하지 않아요.</p></section><section class="help-card"><h3>4. 기록을 옮기고 보관해요</h3><p>읽기 표시·오답·퀴즈 기록은 현재 브라우저에만 저장돼요. 다른 기기·브라우저나 내려받아 사용하던 HTML 버전의 기록은 자동으로 옮겨지지 않아요. 같은 브라우저를 함께 쓰면 학습 기록도 함께 사용해요.</p><p>‘학습 기록 → 기록 백업’에서 JSON 파일을 보관하고, 이 사이트의 ‘백업 복원’으로 옮겨 주세요. 기존 HTML 버전의 백업도 복원할 수 있어요. 브라우저 데이터 삭제·비공개 모드·사이트 주소 변경으로 기록이 사라질 수 있으니 먼저 백업해 주세요.</p></section></div><div class="notice">한자·뜻·대표 음은 첨부하신 「한자6급_학생용_30회_학습지.docx」 기준이에요. 예를 들어 車는 ‘수레 거’, 女는 ‘여자 녀’로 읽어요. 이번 퀴즈에서는 학습지의 대표 뜻과 음을 기준으로 확인해요.</div>`; }

function showModal(html) {

/button><button class="text-link" data-action="study-to-quiz">읽기 퀴즈로 확인 →</button></div><div class="study-progress"><div class="progress-track"><i style="width:${count/s.items.length*100}%"></i></div><span>${count} / ${s.items.length}자 읽기</span></div><p class="keyboard-hint"><kbd>←</kbd><kbd>→</kbd> 카드 이동 &nbsp; <kbd>Space</kbd> 뜻·음 확인 &nbsp; <kbd>Esc</kbd> 닫기</p></div>`);

function renderSetup() {
  const s=session;
  showModal(modalHead(`${s.group}묶음 · ${groupRange(s.group)} 읽기 퀴즈`,'한자를 보고 뜻과 음을 읽은 뒤, 알맞은 보기를 골라요.')+`<div class="modal-body"><div class="quiz-setup"><div class="reading-example"><span class="hanja">家</span><span aria-hidden="true">→</span><strong>집 가</strong></div><p>한자를 보고 뜻과 음을 먼저 소리 내어 읽어 보세요.<br>‘읽었어요 · 보기 열기’를 누른 뒤, 알맞은 뜻과 음을 골라요.<br>시간 제한 없이 천천히 생각해도 괜찮아요.</p><p class="form-label">몇 문제 읽어 볼까요?</p><div class="choice-row" role="group" aria-label="문제 수">${[[10,'가볍게 10문제','한 묶음에서 무작위 10자'],[30,'차근차근 30문제','한 묶음의 30자 모두']].map(([count,label,sub])=>`<button class="choice-button ${s.count===count?'selected':''}" aria-pressed="${s.count===count}" data-action="quiz-count" data-count="${count}">${label}<small>${sub}</small></button>`).join('')}</div><button class="primary" data-action="start-quiz">읽기 퀴즈 시작 ${icon('arrow',17)}</button><p class="keyboard-hint">선택한 ${s.count}문제를 모두 풀면 결과가 기록돼요.</p></div></div>`);
}
function startQuiz(group,mode='reading',count=30,ids=null) {
  // Every new quiz in this edition practices reading, including restored/retry paths.
  mode='reading';
  const items=ids?DATA.filter(x=>ids.includes(x.id)):groupItems(group);
  if(!items.length) return toast('복습할 오답이 없어요.');
  session={type:'quiz',group:Number(group)||1,mode,review:!!ids,questions:E.buildQuiz(items,{mode,count},DATA),index:0,answers:[],selected:null,optionsVisible:false};
  if(!ids) {state.lastGroup=Number(group);save();}
  renderQuestion();
}
function renderQuestion() {
  const s=session,q=s.questions[s.index],answered=s.selected!==null,good=answered&&s.selected===q.answer,score=s.answers.filter(x=>x.correct).length;
  const options=s.optionsVisible?`<div class="quiz-options">${q.options.map((option,i)=>`<button class="option ${answered&&option===q.answer?'correct':''} ${answered&&option===s.selected&&!good?'incorrect':''}" data-action="answer" data-index="${i}" ${answered?'disabled':''}><span class="option-number">${answered&&option===q.answer?'✓':answered&&option===s.selected?'×':i+1}</span><span class="quiz-reading-option">${esc(option)}</span>${answered&&option===q.answer?'<span class="sr-only">정답</span>':''}${answered&&option===s.selected&&!good?'<span class="sr-only">선택한 오답</span>':''}</button>`).join('')}</div>`:`<div class="reading-gate"><button class="primary" data-action="reveal-options">읽었어요 · 보기 열기 ${icon('arrow',17)}</button><p>스스로 읽어 본 뒤 눌러 주세요.</p></div>`;
  showModal(modalHead(s.review?'오답 읽기 퀴즈':`${s.group}묶음 · ${groupRange(s.group)} 읽기 퀴즈`,modeLabel(s.mode))+`<div class="modal-body"><div class="quiz-top"><span>${s.index+1} / ${s.questions.length} 문제</span><span class="quiz-score">${score}개 정답</span></div><div class="progress-track" role="progressbar" aria-label="푼 문제" aria-valuenow="${s.answers.length}" aria-valuemin="0" aria-valuemax="${s.questions.length}"><i style="width:${s.answers.length/s.questions.length*100}%"></i></div><div class="quiz-card" tabindex="-1"><p>${s.optionsVisible?'읽은 뜻과 음에 맞는 보기를 골라요.':'뜻과 음을 먼저 소리 내어 읽어 보세요.'}</p><div class="question-hanja">${esc(q.prompt)}</div></div>${options}${answered?`<div class="feedback ${good?'success':'error'}" role="status"><strong>${good?'맞았어요! 잘 기억했네요.':'괜찮아요. 한 번 더 기억해요.'}</strong><p><span class="hanja">${q.item.hanja}</span> = ${esc(q.item.meaning)} ${esc(q.item.sound)}${!good?' · 오답 노트에 담았어요.':''}</p><button class="primary" data-action="quiz-next">${s.index===s.questions.length-1?'결과 보기':'다음 문제'} ${icon('arrow',15)}</button></div>`:s.optionsVisible?'<p class="keyboard-hint">보기를 누르거나 <kbd>1</kbd>–<kbd>4</kbd> 키로 답을 고르세요.</p>':''}</div>`);
  if(answered) $('[data-action="quiz-next"]').focus({preventScroll:true});
  else if(s.optionsVisible) $('.quiz-options .option').focus({preventScroll:true});
  else $('.quiz-card').focus({preventScroll:true});
}
function answer(index) {
  const s=session;if(!s||s.type!=='quiz'||!s.optionsVisible||s.selected!==null) return;
  const q=s.questions[s.index],selected=q.options[Number(index)]; if(selected===undefined) return;
  s.selected=selected; const correct=selected===q.answer;
  s.answers.push({item:q.item,selected,correct});E.recordAnswer(state,q.item.id,correct);save();renderQuestion();
}
function finishQuiz() {
  const s=session;if(s.type!=='quiz')return;
  s.type='result';s.score=s.answers.filter(x=>x.correct).length;s.mistakes=s.answers.filter(x=>!x.correct).map(x=>x.item);
  E.recordResult(state,{group:s.group,score:s.score,total:s.questions.length,mode:s.mode,review:s.review});save();
  showModal(modalHead('오늘도 한 걸음 완료!',s.review?'오답 읽기 퀴즈':`${s.group}묶음 · ${groupRange(s.group)}`)+`<div class="modal-body"><div class="result-screen" tabindex="-1"><div class="result-emblem">${icon(s.score===s.questions.length?'star':'leaf',38)}</div><h2>${s.score===s.questions.length?'모두 맞혔어요!':s.score/s.questions.length>=.7?'차근차근 잘하고 있어요!':'또 만나면 더 잘할 수 있어요!'}</h2><p>${s.mistakes.length?'틀린 한자를 한 번 더 보면 기억이 단단해져요.':'정말 잘했어요. 배운 한자를 오래 기억해 봐요.'}</p><div class="result-score">${s.score}<small> / ${s.questions.length}</small></div><div class="result-summary"><span>정답률 <strong>${Math.round(s.score/s.questions.length*100)}%</strong></span><span>다시 볼 한자 <strong>${s.mistakes.length}자</strong></span></div><div class="button-row">${s.mistakes.length?'<button class="primary" data-action="retry-mistakes">틀린 한자 다시 풀기</button>':s.group<10&&!s.review?`<button class="primary" data-action="study" data-group="${s.group+1}">다음 묶음 익히기</button>`:''}<button class="secondary" data-action="result-home">공부방으로</button></div>${s.mistakes.length?`<div class="result-list"><h3>다시 기억해 볼까요?</h3>${s.mistakes.map(x=>`<div class="result-row"><span class="hanja">${x.hanja}</span><strong>${esc(x.meaning)} ${esc(x.sound)}</strong><span>${x.lesson}회</span></div>`).join('')}</div>`:''}<p class="keyboard-hint">${storageAvailable?'결과를 이 브라우저에 저장했어요.':'자동 저장이 제한되어 있어요. 창을 닫기 전에 기록을 백업해 주세요.'}</p></div></div>`);
}
function exportBackup() {
  const content=JSON.stringify({app:'hanja-hangeoreum',version:1,exportedAt:new Date().toISOString(),state},null,2);
  const blob=new Blob([content],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  const day=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Seoul'}).format(new Date());
  a.href=url;a.download=`한자한걸음_학습기록_${day}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('학습 기록 백업 파일을 내려받았어요.');
}
async function importBackup(file) {
  if(!file)return;
  try {
    if(file.size>2*1024*1024) throw Error('백업 파일이 너무 커요.');
    const raw=JSON.parse(await file.text());
    if(raw.app!=='hanja-hangeoreum'||raw.version!==1||!raw.state||!Array.isArray(raw.state.known)||!Array.isArray(raw.state.wrong)||!Array.isArray(raw.state.results)) throw Error('한자 한 걸음에서 만든 백업 파일을 선택해 주세요.');
    const restored=E.sanitizeState(raw.state,DATA);
    if(!window.confirm(`백업 기록(읽을 수 있는 한자 ${restored.known.length}자, 퀴즈 ${restored.results.length}회)으로 현재 기록을 바꿀까요? 현재 기록이 필요하면 취소하고 먼저 백업해 주세요.`)) return;
    state=restored;save();render();toast('백업 기록을 복원했어요.');
  }catch(error){toast(error instanceof SyntaxError?'파일을 읽지 못했어요. 올바른 JSON 백업을 선택해 주세요.':error.message);}
  finally {$('#backup-input').value='';}
}
document.addEventListener('click',event=>{
  const b=event.target.closest('[data-action]');if(!b||b.disabled)return;
  const action=b.dataset.action;
  switch(action) {
    case 'nav': navigate(b.dataset.page);break;
    case 'scroll-groups': $('#groups').scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});break;
    case 'study': study(Number(b.dataset.group));break;
    case 'character': {const item=DATA.find(x=>x.id===Number(b.dataset.id));study(item.group,[item.id]);break;}
    case 'study-review': study(state.lastGroup,[...state.wrong]);break;
    case 'close-modal': closeModal();break;
    case 'result-home': closeModal();navigate('home');break;
    case 'flip':
    case 'reveal-reading':session.flipped=!session.flipped;renderStudy();break;
    case 'study-prev':if(session.index>0){session.index--;session.flipped=false;renderStudy();}break;
    case 'study-next':if(session.index<session.items.length-1){session.index++;session.flipped=false;renderStudy();}break;
    case 'study-lesson':session.lesson=Number(b.dataset.lesson);session.items=session.all.filter(x=>!session.lesson||x.lesson===session.lesson);session.index=0;session.flipped=false;renderStudy();break;
    case 'shuffle-study':session.items=E.shuffle(session.items);session.index=0;session.flipped=false;renderStudy();toast('카드 순서를 섞었어요.');break;
    case 'toggle-known':{const id=session.items[session.index].id;if(state.known.includes(id))state.known=state.known.filter(x=>x!==id);else E.recordAnswer(state,id,true);save();renderStudy();break;}
    case 'study-to-quiz':if(session.review)startQuiz(session.group,'reading',Math.min(30,session.items.length),session.items.map(x=>x.id));else setupQuiz(session.group);break;
    case 'quiz-setup':setupQuiz(Number(b.dataset.group));break;
    case 'quiz-count':session.count=Number(b.dataset.count);renderSetup();break;
    case 'start-quiz':startQuiz(session.group,session.mode,session.count);break;
    case 'review-quiz':startQuiz(state.lastGroup,'reading',30,[...state.wrong]);break;
    case 'reveal-options':if(session?.type==='quiz'&&session.selected===null){session.optionsVisible=true;renderQuestion();}break;
    case 'answer':answer(b.dataset.index);break;
    case 'quiz-next':if(session.selected===null)return;if(session.index===session.questions.length-1)finishQuiz();else{session.index++;session.selected=null;session.optionsVisible=false;renderQuestion();}break;
    case 'retry-mistakes':startQuiz(session.group,session.mode,30,session.mistakes.map(x=>x.id));break;
    case 'dictionary-filter':dictionaryFilter=b.dataset.filter;render();break;
    case 'export':exportBackup();break;
    case 'import':$('#backup-input').click();break;
    case 'reset':if(window.confirm('이 브라우저의 읽기 표시·오답·퀴즈 기록을 모두 지울까요? 지운 기록은 백업 파일이 있어야 복원할 수 있어요.')){state=E.initialState();save();render();toast('학습 기록을 초기화했어요.');}break;
  }
});
document.addEventListener('input',event=>{if(event.target.id==='hanja-search'){searchTerm=event.target.value;$('#dictionary-results').innerHTML=dictionaryResults();}});
document.addEventListener('change',event=>{if(event.target.id==='group-filter'){groupFilter=event.target.value;$('#dictionary-results').innerHTML=dictionaryResults();}if(event.target.id==='backup-input')importBackup(event.target.files[0]);});
$('#learning-modal').addEventListener('cancel',event=>{event.preventDefault();closeModal();});
$('#learning-modal').addEventListener('click',event=>{if(event.target===$('#learning-modal')){const r=event.target.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeModal();}});
document.addEventListener('keydown',event=>{
  if(!session||event.ctrlKey||event.metaKey||event.altKey||/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;
  if(session.type==='study'){
    if(event.key==='ArrowLeft'&&session.index>0){event.preventDefault();session.index--;session.flipped=false;renderStudy();}
    if(event.key==='ArrowRight'&&session.index<session.items.length-1){event.preventDefault();session.index++;session.flipped=false;renderStudy();}
    if(event.code==='Space'&&!['BUTTON','A'].includes(document.activeElement.tagName)){event.preventDefault();session.flipped=!session.flipped;renderStudy();}
  }
  if(session.type==='quiz'&&/^[1-4]$/.test(event.key)){event.preventDefault();answer(Number(event.key)-1);}
  if(session.type==='quiz'&&event.key==='Enter'&&session.selected!==null&&!['BUTTON','A'].includes(document.activeElement.tagName)){event.preventDefault();$('[data-action="quiz-next"]').click();}
});
render();
</script>
</body>
</html>
